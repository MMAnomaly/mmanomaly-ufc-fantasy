services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mmanomaly
      POSTGRES_PASSWORD: mmanomaly
      POSTGRES_DB: mmanomaly
    ports:
      - "5432:5432"
    volumes:
      - mmanomaly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmanomaly -d mmanomaly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mmanomaly_pg:
